{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}

<div class="d-flex justify-content-center">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="mb-3 text-center">Вход</h4>
        <form method="post" action="{% url 'login_post' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-control" id="username" value="{{ request.POST.username }}">
                {% if username_error %}
                    <div class="invalid-feedback d-block">{{ username_error }}</div>
                {% endif %}
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" id="password">
                {% if password_error %}
                    <div class="invalid-feedback d-block">{{ password_error }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-success w-100">Войти</button>
        </form>
        <p class="mt-3 text-center">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>

{% endblock %}
